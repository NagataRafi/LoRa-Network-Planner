<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perencana Jaringan LoRa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="toolbar">
    <h1>Perencana Jaringan LoRa</h1>
    <div class="mode">
      <button type="button" data-mode="pilih" class="aktif">Pilih/Geser</button>
      <button type="button" data-mode="gateway">Tambah Gateway</button>
      <button type="button" data-mode="node">Tambah Node</button>
    </div>
    <button type="button" id="btn-reset">Reset</button>
  </header>

  <main class="konten">
    <aside id="panel">
      <section>
        <h2>Parameter Global</h2>
        <div class="form">
          <label for="inp-f">Frekuensi (MHz)</label>
          <input id="inp-f" type="number" step="any">
          <div class="preset">
            <button type="button" data-f="433">433</button>
            <button type="button" data-f="868">868</button>
            <button type="button" data-f="915">915</button>
            <button type="button" data-f="923">923</button>
          </div>

          <label for="sel-sf">Spreading Factor</label>
          <select id="sel-sf">
            <option value="7">SF7</option>
            <option value="8">SF8</option>
            <option value="9">SF9</option>
            <option value="10">SF10</option>
            <option value="11">SF11</option>
            <option value="12">SF12</option>
          </select>

          <label for="sel-bw">Bandwidth (kHz)</label>
          <select id="sel-bw">
            <option value="125">125</option>
            <option value="250">250</option>
            <option value="500">500</option>
          </select>

          <label for="inp-nf">Noise figure (dB)</label>
          <input id="inp-nf" type="number" step="any">

          <label for="sel-env">Lingkungan</label>
          <select id="sel-env">
            <option value="ruangBebas">Ruang bebas (n=2)</option>
            <option value="pinggiranKota">Pinggiran kota (n=2.7)</option>
            <option value="perkotaan">Perkotaan (n=3.2)</option>
            <option value="padat">Padat (n=3.8)</option>
          </select>

          <label for="inp-margin">Margin target (dB)</label>
          <input id="inp-margin" type="number" step="any">
        </div>
      </section>

      <section>
        <h2>Perangkat</h2>
        <div id="form-perangkat"></div>
      </section>

      <section>
        <h2>Ringkasan</h2>
        <div id="ringkasan"></div>
      </section>

      <section>
        <h2>Hasil Analisis</h2>
        <div class="tabel-bungkus">
          <table id="tabel-hasil">
            <thead>
              <tr>
                <th>Node</th>
                <th>Gateway terbaik</th>
                <th>Jarak (km)</th>
                <th>RSSI (dBm)</th>
                <th>FM (dB)</th>
                <th>Status</th>
                <th>SF rekomendasi</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </aside>

    <div id="peta"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/lora.js"></script>
  <script src="js/store.js"></script>
  <script src="js/mapview.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
