<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body>

    <h1>Perencana Jaringan LoRa</h1>

  <div id="peta"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

  <script src="js/app.js"></script>

</html>
